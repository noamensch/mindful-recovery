<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5282"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Breathing circle (outer) -->
  <circle cx="256" cy="240" r="140" fill="#4a7ab5" opacity="0.4"/>

  <!-- Breathing circle (inner) -->
  <circle cx="256" cy="240" r="90" fill="#63b3ed" opacity="0.8"/>

  <!-- Center dot -->
